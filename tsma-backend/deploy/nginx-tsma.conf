# /etc/nginx/sites-available/tsma  (kisha: ln -s kwenye sites-enabled/)
# Badilisha tsma.or.tz kama domain yako ni tofauti.
# Domain MOJA kwa kila kitu: frontend (React) + /api + /admin  => hakuna tatizo la CORS.

server {
    listen 80;
    server_name tsma.or.tz www.tsma.or.tz;

    # Uploads (CV, ID ya chuo, PDF) - Django inaruhusu hadi MB 15
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Backend (Django/gunicorn) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # inahitajika: settings.SECURE_PROXY_SSL_HEADER
        proxy_read_timeout 60s;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static za Django (admin css n.k.) - zinatoka `collectstatic`
    location /static/ {
        alias /srv/tsma/tsma-backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # ---- Media (uploads) ----
    # FOLDA NYETI: HAZITOLEWI hadharani. Zinapatikana TU kupitia Django:
    #   publications/files, publications/abstracts -> /api/publications/<slug>/download/ (inahakiki ruhusa)
    #   student_ids -> Django Admin pekee (admin aliyeingia)
    #   careers/cvs -> Django Admin pekee
    location /media/publications/files/     { deny all; return 404; }
    location /media/publications/abstracts/ { deny all; return 404; }
    location /media/student_ids/            { deny all; return 404; }
    location /media/careers/cvs/            { deny all; return 404; }

    # Media nyingine (picha za bodi, news, gallery, kadi, risiti n.k.)
    location /media/ {
        alias /srv/tsma/tsma-backend/media/;
        expires 7d;
        access_log off;
    }

    # ---- Frontend (React, build ya static) ----
    root /srv/tsma/frontend-dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA: /verify-member/<code> n.k. zifunguke moja kwa moja
    }
}
